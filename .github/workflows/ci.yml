name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (no model needed)
        run: python -m unittest discover -s tests -v
      - name: rules-only smoke on every sample
        run: for f in samples/*.txt; do python -m gigguard --no-llm check "$f"; done
